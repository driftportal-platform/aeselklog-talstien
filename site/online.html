<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÆselKlog Online · Kortspil</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:#f6f9fd;font-family:system-ui}
.hidden{display:none}
.card{width:70px;height:100px;border-radius:12px;border:2px solid #124075;display:grid;place-items:center;background:#fff;font-weight:900;font-size:1.4rem;margin:4px}
.card.back{background:#124075;color:#fff}
.players,.centers{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.player{border:2px solid #dae5ef;border-radius:14px;padding:10px;min-width:140px}
.player.turn{border-color:#1976d2;background:#e8f3ff}
button{min-height:44px}
</style>
</head>
<body>
<div class="shell" style="max-width:900px;margin:auto;padding:16px">
  <p><a id="onlineBack" href="../index.html" style="display:inline-flex;align-items:center;min-height:44px;padding:9px 15px;border:1px solid #b8d0e9;border-radius:12px;text-decoration:none;color:#124075;font-weight:700;background:#fff">← Tilbage til spilmenu</a></p>
  <h1>ÆselKlog Online <small style="color:#62758a">v0.9.39</small></h1>
  <section id="setup">
    <p>Opret et rum eller deltag med kode.</p>
    <input id="name" placeholder="Dit navn" maxlength="25">
    <select id="range"><option>1-20</option><option>21-40</option><option>41-60</option><option>61-80</option><option>81-100</option></select>
    <button id="create">Opret rum</button>
    <hr>
    <input id="joinCode" placeholder="Rumkode" maxlength="8">
    <button id="join">Deltag</button>
    <p id="setupError" style="color:#c0392b"></p>
  </section>
  <section id="game" class="hidden">
    <p>Rum: <strong id="code"></strong> · <span id="message"></span></p>
    <div id="players" class="players"></div>
    <div id="centers" class="centers"></div>
    <div id="current"></div>
    <div id="actions"></div>
    <p id="actionError" style="color:#c0392b"></p>
    <button id="challenge" class="hidden">Udfordr sidste træk 🫏</button>
  </section>
</div>
<script src="./parent-gate.js"></script>
<script src="./online-config.js"></script>
<script src="./online.js"></script>
</body>
</html>
